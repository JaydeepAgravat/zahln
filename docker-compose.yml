services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zahln
      POSTGRES_PASSWORD: zahln
      POSTGRES_DB: zahln
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zahln -d zahln"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
