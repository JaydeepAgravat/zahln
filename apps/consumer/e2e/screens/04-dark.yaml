# README gallery: the wallet and a payment in dark mode (scripts/screens/mobile.sh switches the simulator).
appId: de.zaster.app
name: Screens · Zaster dark
---
- stopApp
- launchApp
- runFlow: ../unlock.yaml
- extendedWaitUntil:
    visible: "Balance"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: zaster-19-wallet-dark
- runScript: ../scripts/till-intent.js
- openLink: "zaster://i/${output.ref}"
- extendedWaitUntil:
    visible: "Café Mila"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: zaster-20-pay-dark
