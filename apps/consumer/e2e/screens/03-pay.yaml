# README gallery: paying. A till QR as a link, the PIN sheet, Paid; then a rejected and a slow-to-confirm
# payment (simulated rail), a static @handle QR, and the forced-update gate.
appId: de.zaster.app
name: Screens · Zaster paying
---
- launchApp
- runFlow: ../unlock.yaml
- extendedWaitUntil:
    visible: "Balance"
    timeout: 15000
# Happy path
- runScript: ../scripts/till-intent.js
- openLink: "zaster://i/${output.ref}"
- extendedWaitUntil:
    visible: "Café Mila"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: zaster-11-pay
- tapOn:
    text: "Pay with PIN · €6.30"
- extendedWaitUntil:
    visible: "Enter your PIN"
    timeout: 5000
- tapOn: "2"
- tapOn: "7"
- tapOn: "1"
- waitForAnimationToEnd
- takeScreenshot: zaster-12-pin-sheet
- tapOn: "8"
- tapOn: "2"
- tapOn: "8"
- extendedWaitUntil:
    visible: "Paid"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: zaster-13-paid
- tapOn: "Done"
# The rail rejects: nothing charged
- runScript: ../scripts/till-intent.js
- runScript:
    file: ../scripts/chaos.js
    env:
      MODE: reject
- openLink: "zaster://i/${output.ref}"
- extendedWaitUntil:
    visible: "Café Mila"
    timeout: 10000
- tapOn:
    text: "Pay with PIN · €6.30"
- runFlow: ../pin.yaml
- extendedWaitUntil:
    visible: "Not charged"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: zaster-14-not-charged
- tapOn: "Done"
# Not enough balance (simulated): nothing charged, top up offered
- runScript: ../scripts/till-intent.js
- runScript:
    file: ../scripts/chaos.js
    env:
      MODE: insufficient
- openLink: "zaster://i/${output.ref}"
- extendedWaitUntil:
    visible: "Café Mila"
    timeout: 10000
- tapOn:
    text: "Pay with PIN · €6.30"
- runFlow: ../pin.yaml
- extendedWaitUntil:
    visible: "Not enough balance"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: zaster-15-insufficient
- runScript:
    file: ../scripts/chaos.js
    env:
      MODE: ok
- tapOn: "Done"
# The bank settles, the answer is lost, and the bank is slow to confirm: "Checking" holds until the
# lookup works again, then the app finds the one payment
- runScript: ../scripts/till-intent.js
- runScript:
    file: ../scripts/chaos.js
    env:
      MODE: drop_and_hold
- openLink: "zaster://i/${output.ref}"
- extendedWaitUntil:
    visible: "Café Mila"
    timeout: 10000
- tapOn:
    text: "Pay with PIN · €6.30"
- runFlow: ../pin.yaml
- extendedWaitUntil:
    visible: ".*Checking.*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: zaster-16-checking
- runScript:
    file: ../scripts/chaos.js
    env:
      MODE: ok
- extendedWaitUntil:
    visible: "Paid"
    timeout: 30000
- tapOn: "Done"
# A merchant's static QR: the payer types the amount
- openLink: "zaster://@doener-ali"
- extendedWaitUntil:
    visible: "Enter amount"
    timeout: 10000
- tapOn: "8"
- tapOn: "5"
- tapOn: "0"
- waitForAnimationToEnd
- takeScreenshot: zaster-17-handle
# Forced update: ops raise the minimum version; the app checks /config on launch
- runScript:
    file: ../scripts/min-version.js
    env:
      VERSION: 9.9.9
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Please update"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: zaster-18-update
- runScript:
    file: ../scripts/min-version.js
    env:
      VERSION: 0.1.0
